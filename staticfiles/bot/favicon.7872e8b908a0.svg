<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#000000"/>
  <rect x="0" y="0" width="12" height="12" fill="#76b900"/>
  <rect x="52" y="52" width="12" height="12" fill="#76b900"/>
  <text x="32" y="44" font-family="Inter, Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ce000"/>
      <stop offset="100%" stop-color="#76b900"/>
    </linearGradient>
  </defs>
  <!-- Fundo com cantos modernos arredondados -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#green)" stroke-width="2.5"/>
  <!-- Acento superior verde tech -->
  <circle cx="32" cy="11" r="2.5" fill="url(#green)"/>
  <!-- Letra A marcante -->
  <text x="32" y="47" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
  <!-- Acentos nos cantos característicos -->
  <rect x="6" y="6" width="4" height="4" rx="1" fill="#76b900"/>
  <rect x="54" y="54" width="4" height="4" rx="1" fill="#76b900"/>
</svg>