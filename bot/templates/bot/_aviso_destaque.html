{% if avisos_destaque %}
<section class="section aviso-destaque-section" id="avisos">
    <div class="container">
        <div class="section-head">
            <div>
                <div class="section-eyebrow">Quadro de Avisos</div>
                <h2 class="section-title xl">Atenção para essas promoções</h2>
            </div>
            <a href="{% url 'avisos' %}" class="btn-ghost">Ver todos <i class="fas fa-arrow-right arrow"></i></a>
        </div>
        <div class="aviso-destaque-grid">
            {% for aviso in avisos_destaque %}
            <a href="{% url 'aviso_detail' aviso.slug %}" class="aviso-card" style="color:inherit;text-decoration:none;">
                {% if aviso.imagem %}
                <div class="aviso-card-thumb">
                    <img src="{{ aviso.imagem.url }}" alt="{{ aviso.titulo }}" loading="lazy">
                </div>
                {% endif %}
                <div class="aviso-card-body">
                    <span class="blog-card-cat">Aviso</span>
                    <h3 class="blog-card-title">{{ aviso.titulo }}</h3>
                    <span class="blog-card-date">{{ aviso.atualizado_em|date:"d/m/Y" }}</span>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
