{% for artigo in artigos %}
<a href="{% url 'blog_artigo' artigo.slug %}" class="blog-card" style="color:inherit;text-decoration:none;">
    {% if artigo.imagem %}
    <div class="blog-card-thumb">
        <img src="{{ artigo.imagem.url }}" alt="{{ artigo.titulo }}" loading="lazy">
    </div>
    {% endif %}
    <div class="blog-card-body">
        {% if artigo.categoria %}<span class="blog-card-cat">{{ artigo.categoria }}</span>{% endif %}
        <h2 class="blog-card-title">{{ artigo.titulo }}</h2>
        <span class="blog-card-date">{{ artigo.atualizado_em|date:"d/m/Y" }}</span>
    </div>
</a>
{% empty %}
<p class="blog-empty">Nenhum artigo encontrado. Tente outra busca ou categoria.</p>
{% endfor %}
